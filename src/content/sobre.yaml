eyebrow: Sobre o artista
titulo: JHONATHAM COSMO
paragrafos:
  - Tatuador por paixão e artista por essência. Meu trabalho é uma fusão entre a pele e a tela, onde o traço se transforma em expressão, liberdade e verdade.
  - Cada obra carrega um pedaço da minha história, das minhas influências e da minha visão de mundo. A arte sempre foi o meu jeito de existir — agora, também em quadros.
